name: New figure
description: Propose a figure for an annual report or factsheet
title: "[Figure] "
labels: ["figure"]
body:
  - type: input
    id: year
    attributes:
      label: Update year
      placeholder: "2026"
    validations:
      required: true
  - type: input
    id: path
    attributes:
      label: Proposed folder
      description: Use the new-work convention, for example 2026/annual-report/01-global/fig-1-4/
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Inputs and output
      description: Which table produces the figure, and what file should be committed.
    validations:
      required: true
